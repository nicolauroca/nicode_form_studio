COM_NICODE_FORM_STUDIO_HEALTH_PHP_LIMITS_HELP="Valores efectivos para esta petición web; informan de la capacidad y no garantizan la entrega. Los sufijos K, M y G usan múltiplos de 1024; los tiempos son segundos. file_uploads: 1 activado, 0 desactivado. Sin JavaScript, cada valor enviado cuenta para max_input_vars. El envío mejorado agrupa los valores en una parte JSON (presupuesto de aplicación de 2 MiB); los archivos y campos de seguridad siguen ocupando partes multipart. post_max_size abarca toda la petición; upload_max_filesize y max_file_uploads afectan a las subidas. max_multipart_body_parts=-1 deriva su límite de max_input_vars más max_file_uploads. Los valores cero o negativos tienen significados específicos de cada directiva. El servidor web o proxy puede imponer límites adicionales. Solicite al administrador del alojamiento que dimensione estos límites para sus formularios y pruebe ambas vías de envío."

