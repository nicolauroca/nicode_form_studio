COM_NICODE_FORM_STUDIO_HEALTH_PHP_LIMITS_HELP="Effective values for this web request; these are capacity information, not a delivery guarantee. Size suffixes K, M and G use multiples of 1024; times are seconds. file_uploads: 1 enabled, 0 disabled. Without JavaScript, each submitted value counts towards max_input_vars. Enhanced submissions pack values into one JSON part (2 MiB application budget); files and security fields still use multipart parts. post_max_size covers the entire request; upload_max_filesize and max_file_uploads apply to uploads. max_multipart_body_parts=-1 derives its limit from max_input_vars plus max_file_uploads. Zero or negative values have directive-specific meanings. Your web server or proxy may impose additional limits. Ask your hosting administrator to size these limits for your forms and test both submission paths."

